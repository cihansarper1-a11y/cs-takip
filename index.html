<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>CS TAKİP — Offline</title>
<style>
:root{--bg:#080e19;--panel:#101a2a;--panel2:#162338;--line:#263750;--text:#f3f7ff;--muted:#94a5bd;--accent:#3d8bff;--danger:#ff5b68;--ok:#35c88a;--warn:#f2b84b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:920px;margin:auto;padding-bottom:105px}.top{padding:18px 18px 14px;position:sticky;top:0;z-index:10;background:#0b1220ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:900;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.content{padding:16px}.hero{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#16243a,#0e1726);margin-bottom:12px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.num{font-size:28px;font-weight:900;margin-top:5px}.label{font-size:12px;color:var(--muted)}.section{margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px}.section h3{margin:0 0 10px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:0;border-radius:13px;padding:12px 13px;background:var(--accent);color:white;font-weight:800;font-size:14px}.btn.secondary{background:var(--panel2)}.btn.danger{background:#7d2632}.btn.ok{background:#176e4f}.btn:active{transform:scale(.98)}.list{display:grid;gap:8px}.item{background:#0d1726;border:1px solid var(--line);border-radius:15px;padding:13px}.item b{font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#20314b;color:#d8e6ff}.pill.red{background:#49202a;color:#ffb5bd}.pill.green{background:#123b30;color:#8ce0be}.pill.yellow{background:#443617;color:#f6cf7b}.empty{text-align:center;color:var(--muted);padding:24px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c1422f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav{flex:1;border:0;background:none;color:#8192ab;font-size:10px;font-weight:700;padding:4px 1px}.nav span{display:block;font-size:21px;line-height:22px;margin-bottom:2px}.nav.active{color:#fff}.search{width:100%;padding:12px;border:1px solid var(--line);background:#0d1726;color:#fff;border-radius:13px;margin:8px 0 12px}.form{display:grid;gap:7px}.form input,.form select,.form textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c1523;color:#fff}.form textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{font-size:12px;color:#b9c6d8;background:#111e31;border:1px solid var(--line);padding:10px;border-radius:12px;margin-top:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar .search{margin:0;flex:1;min-width:180px}.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(920px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:var(--panel2);color:#fff;border-radius:12px;padding:9px 12px;font-size:18px}.small{font-size:11px;color:var(--muted)}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modalbox{border-radius:24px;max-width:560px}.cards{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">CS TAKİP</div><div class="sub">Cihan Sarper • Offline İş Takip Merkezi</div></header><main id="screen" class="content"></main>
<nav class="bottom"><button class="nav" data-p="home" onclick="show('home')"><span>⌂</span>Ana Panel</button><button class="nav" data-p="tasks" onclick="show('tasks')"><span>✓</span>İşler</button><button class="nav" data-p="sites" onclick="show('sites')"><span>🏢</span>Siteler</button><button class="nav" data-p="calendar" onclick="show('calendar')"><span>◷</span>Takvim</button><button class="nav" data-p="more" onclick="show('more')"><span>☷</span>Diğer</button></nav></div>
<div id="modal" class="modal" style="display:none"></div>
<script>
const STORAGE_KEY='CS_TAKIP_IPHONE11_V3';
const screenEl=document.getElementById('screen'),modalEl=document.getElementById('modal');
const emptyDb=()=>({sites:[],tasks:[],events:[],audits:[],budgets:[],docs:[]});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||emptyDb()}catch{db=emptyDb()}
for(const k of Object.keys(emptyDb())) if(!Array.isArray(db[k])) db[k]=[];
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))} function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(p){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===p))}
function show(p,updateHash=true){if(updateHash) history.replaceState(null,'','#'+p);nav(p);({home,tasks,sites,calendar,more}[p]||home)()}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'home',false));
function home(){const today=new Date().toISOString().slice(0,10),open=db.tasks.filter(x=>x.status!=='Tamamlandı'),overdue=open.filter(x=>x.due&&x.due<today),done=db.tasks.filter(x=>x.status==='Tamamlandı');screenEl.innerHTML=`<div class="hero"><h1>Hoş geldin 👋</h1><p>İşlerini, sitelerini, denetimlerini ve takvimini tek ekrandan yönet.</p></div><div class="cards"><div class="card"><div class="label">Açık İş</div><div class="num">${open.length}</div></div><div class="card"><div class="label">Geciken</div><div class="num">${overdue.length}</div></div><div class="card"><div class="label">Siteler</div><div class="num">${db.sites.length}</div></div><div class="card"><div class="label">Tamamlanan</div><div class="num">${done.length}</div></div></div><div class="section"><h3>Hızlı İşlem</h3><div class="actions"><button class="btn" onclick="newTask()">＋ İş Ekle</button><button class="btn secondary" onclick="newSite()">＋ Site Ekle</button><button class="btn secondary" onclick="newEvent()">＋ Takvim</button><button class="btn secondary" onclick="show('more')">☷ Modüller</button></div></div><div class="section"><h3>Öncelikli İşler</h3><div class="list">${open.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5).map(taskCard).join('')||'<div class="empty">Açık iş bulunmuyor.</div>'}</div></div>`}
function taskCard(x){let c=x.priority==='Acil'?'red':x.priority==='Yüksek'?'yellow':'';return `<div class="item"><b>${e(x.title)}</b><div class="meta">${e(x.site||'Genel')} • ${e(x.due||'Tarih yok')}</div><div class="pills"><span class="pill ${c}">${e(x.priority||'Normal')}</span><span class="pill ${x.status==='Tamamlandı'?'green':''}">${e(x.status||'Bekliyor')}</span></div><div class="toolbar" style="margin:9px 0 0"><button class="btn ok" onclick="complete('${x.id}')">${x.status==='Tamamlandı'?'Geri Al':'Tamamla'}</button><button class="btn secondary" onclick="editTask('${x.id}')">Düzenle</button><button class="btn danger" onclick="deleteItem('tasks','${x.id}','İşi silmek istiyor musun?')">Sil</button></div></div>`}
function tasks(){screenEl.innerHTML=`<h2>İş Takibi</h2><div class="toolbar"><input id="taskSearch" class="search" placeholder="İşlerde ara..." oninput="filterList('tasklist',this.value)"><button class="btn" onclick="newTask()">＋ Yeni İş</button></div><div id="tasklist" class="list">${db.tasks.slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(taskCard).join('')||'<div class="empty">Henüz iş eklenmedi.</div>'}</div>`}
function filterList(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' .item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')}
function openModal(title,body){modalEl.innerHTML=`<div class="modalbox"><div class="modalhead"><h3 style="margin:0">${title}</h3><button class="close" onclick="closeModal()">×</button></div>${body}</div>`;modalEl.style.display='flex'}function closeModal(){modalEl.style.display='none';modalEl.innerHTML=''}
function newTask(existing){const x=existing||{};openModal(existing?'İşi Düzenle':'Yeni İş',`<form class="form" onsubmit="submitTask(event,'${x.id||''}')"><input name="title" required placeholder="İş başlığı" value="${e(x.title)}"><input name="site" placeholder="Site" value="${e(x.site)}"><div class="row"><input name="due" type="date" value="${e(x.due)}"><select name="priority"><option ${x.priority==='Acil'?'selected':''}>Acil</option><option ${x.priority==='Yüksek'?'selected':''}>Yüksek</option><option ${!x.priority||x.priority==='Normal'?'selected':''}>Normal</option><option ${x.priority==='Düşük'?'selected':''}>Düşük</option></select></div><textarea name="note" placeholder="Not">${e(x.note)}</textarea><button class="btn">Kaydet</button></form>`)}
function submitTask(ev,existingId){ev.preventDefault();const f=new FormData(ev.target),data={title:f.get('title'),site:f.get('site'),due:f.get('due'),priority:f.get('priority'),note:f.get('note')};if(existingId){Object.assign(db.tasks.find(x=>x.id===existingId),data)}else db.tasks.push({id:id(),...data,status:'Bekliyor'});save();closeModal();show('tasks')}
function editTask(i){const x=db.tasks.find(a=>a.id===i);if(x)newTask(x)} function complete(i){const x=db.tasks.find(a=>a.id===i);if(x)x.status=x.status==='Tamamlandı'?'Bekliyor':'Tamamlandı';save();show('home')}
function sites(){screenEl.innerHTML=`<h2>Site Yönetimi</h2><div class="toolbar"><input class="search" placeholder="Site ara..." oninput="filterList('sitelist',this.value)"><button class="btn" onclick="newSite()">＋ Yeni Site</button></div><div id="sitelist" class="list">${db.sites.map(siteCard).join('')||'<div class="empty">Henüz site eklenmedi.</div>'}</div>`}
function siteCard(x){return `<div class="item"><b>${e(x.name)}</b><div class="meta">${e(x.blocks||'-')} blok • ${e(x.units||'-')} konut • ${e(x.manager||'Yönetici bilgisi yok')}</div><div class="pills"><span class="pill">${e(x.commercial||0)} ticari alan</span></div><div class="toolbar" style="margin:9px 0 0"><button class="btn secondary" onclick="editSite('${x.id}')">Düzenle</button><button class="btn danger" onclick="deleteItem('sites','${x.id}','Siteyi silmek istiyor musun?')">Sil</button></div></div>`}
function newSite(existing){const x=existing||{};openModal(existing?'Siteyi Düzenle':'Yeni Site',`<form class="form" onsubmit="submitSite(event,'${x.id||''}')"><input name="name" required placeholder="Site adı" value="${e(x.name)}"><div class="row"><input name="blocks" inputmode="numeric" placeholder="Blok sayısı" value="${e(x.blocks)}"><input name="units" inputmode="numeric" placeholder="Konut sayısı" value="${e(x.units)}"></div><div class="row"><input name="commercial" inputmode="numeric" placeholder="Ticari alan" value="${e(x.commercial)}"><input name="manager" placeholder="Yönetici / iletişim" value="${e(x.manager)}"></div><button class="btn">Kaydet</button></form>`)}
function submitSite(ev,existingId){ev.preventDefault();const f=new FormData(ev.target),data={name:f.get('name'),blocks:f.get('blocks'),units:f.get('units'),commercial:f.get('commercial'),manager:f.get('manager')};if(existingId)Object.assign(db.sites.find(x=>x.id===existingId),data);else db.sites.push({id:id(),...data});save();closeModal();show('sites')}function editSite(i){const x=db.sites.find(a=>a.id===i);if(x)newSite(x)}
function calendar(){screenEl.innerHTML=`<h2>Takvim</h2><div class="toolbar"><button class="btn" onclick="newEvent()">＋ Etkinlik Ekle</button></div><div class="list">${db.events.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(x=>`<div class="item"><b>${e(x.title)}</b><div class="meta">${e(x.date||'Tarih yok')} • ${e(x.type||'Genel')}</div><div style="margin-top:6px">${e(x.note||'')}</div><div class="toolbar" style="margin:9px 0 0"><button class="btn secondary" onclick="editEvent('${x.id}')">Düzenle</button><button class="btn danger" onclick="deleteItem('events','${x.id}','Etkinliği silmek istiyor musun?')">Sil</button></div></div>`).join('')||'<div class="empty">Takvim boş.</div>'}</div>`}
function newEvent(existing){const x=existing||{};openModal(existing?'Etkinliği Düzenle':'Takvime Ekle',`<form class="form" onsubmit="submitEvent(event,'${x.id||''}')"><input name="title" required placeholder="Etkinlik" value="${e(x.title)}"><div class="row"><input name="date" type="date" value="${e(x.date)}"><select name="type"><option ${!x.type||x.type==='Toplantı'?'selected':''}>Toplantı</option><option ${x.type==='Denetim'?'selected':''}>Denetim</option><option ${x.type==='Genel Kurul'?'selected':''}>Genel Kurul</option><option ${x.type==='Ziyaret'?'selected':''}>Ziyaret</option><option ${x.type==='Genel'?'selected':''}>Genel</option></select></div><textarea name="note" placeholder="Not">${e(x.note)}</textarea><button class="btn">Kaydet</button></form>`)}
function submitEvent(ev,existingId){ev.preventDefault();const f=new FormData(ev.target),data={title:f.get('title'),date:f.get('date'),type:f.get('type'),note:f.get('note')};if(existingId)Object.assign(db.events.find(x=>x.id===existingId),data);else db.events.push({id:id(),...data});save();closeModal();show('calendar')}function editEvent(i){const x=db.events.find(a=>a.id===i);if(x)newEvent(x)}
function more(){screenEl.innerHTML=`<h2>Diğer Modüller</h2><div class="section"><h3>📋 Denetim</h3><button class="btn secondary" onclick="audits()">Denetim Takibi</button></div><div class="section"><h3>💰 Bütçe</h3><button class="btn secondary" onclick="budgets()">Bütçe Takibi</button></div><div class="section"><h3>💾 Veri Güvenliği</h3><div class="actions"><button class="btn secondary" onclick="backup()">Yedek Al</button><label class="btn secondary" style="text-align:center">Yedek Yükle<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label></div><div class="notice">Kayıtlar bu cihazın tarayıcı depolamasında tutulur. Düzenli yedek al.</div></div><div class="section"><h3>⚠️ Sıfırlama</h3><button class="btn danger" onclick="wipe()">Tüm verileri sil</button></div>`}
function audits(){screenEl.innerHTML=`<h2>Denetim Takibi</h2><button class="btn" onclick="addAudit()">＋ Denetim Ekle</button><div class="list" style="margin-top:10px">${db.audits.map(x=>`<div class="item"><b>${e(x.site)}</b><div class="meta">${e(x.type)} • ${e(x.date)}</div><div class="pills"><span class="pill">${e(x.status)}</span></div></div>`).join('')||'<div class="empty">Kayıt yok.</div>'}</div><div class="section"><button class="btn secondary" onclick="show('more')">← Diğer Modüller</button></div>`}
function addAudit(){const site=prompt('Site:');if(!site)return;db.audits.push({id:id(),site,type:prompt('Tür:','Mali Denetim')||'',date:prompt('Tarih:')||'',status:'Planlandı'});save();audits()}
function budgets(){screenEl.innerHTML=`<h2>Bütçe Takibi</h2><button class="btn" onclick="addBudget()">＋ Bütçe Ekle</button><div class="list" style="margin-top:10px">${db.budgets.map(x=>`<div class="item"><b>${e(x.site)}</b><div class="meta">${e(x.period)}</div><div class="pills"><span class="pill">${e(x.status)}</span></div></div>`).join('')||'<div class="empty">Kayıt yok.</div>'}</div><div class="section"><button class="btn secondary" onclick="show('more')">← Diğer Modüller</button></div>`}
function addBudget(){const site=prompt('Site:');if(!site)return;db.budgets.push({id:id(),site,period:prompt('Bütçe dönemi:','2026')||'',status:'Hazırlanacak'});save();budgets()}
function deleteItem(collection,itemId,msg){if(confirm(msg)){db[collection]=db[collection].filter(x=>x.id!==itemId);save();show(location.hash.slice(1)||'home')}}
function backup(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CS_TAKIP_YEDEK_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tasks||!x.sites)throw 0;db={...emptyDb(),...x};save();show('home')}catch{alert('Geçersiz CS TAKİP yedek dosyası.')}};r.readAsText(f)}
function wipe(){if(confirm('Tüm CS TAKİP kayıtları bu cihazdan silinecek. Emin misin?')){db=emptyDb();save();show('home')}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
show(location.hash.slice(1)||'home',false);
</script></body></html>
