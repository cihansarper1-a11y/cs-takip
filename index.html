<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>CS TAKİP — Offline</title>
<style>
:root{--bg:#080e19;--panel:#101a2a;--panel2:#162338;--line:#263750;--text:#f3f7ff;--muted:#94a5bd;--accent:#3d8bff;--danger:#ff5b68;--ok:#35c88a;--warn:#f2b84b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:920px;margin:auto;padding-bottom:92px}.top{padding:18px 18px 14px;position:sticky;top:0;z-index:5;background:#0b1220ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{font-size:24px;font-weight:900;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.content{padding:16px}.hero{padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#16243a,#0e1726);margin-bottom:12px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px}.num{font-size:28px;font-weight:900;margin-top:5px}.label{font-size:12px;color:var(--muted)}.section{margin-top:13px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px}.section h3{margin:0 0 10px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:0;border-radius:13px;padding:12px 13px;background:var(--accent);color:white;font-weight:800;font-size:14px}.btn.secondary{background:var(--panel2)}.btn.danger{background:#7d2632}.list{display:grid;gap:8px}.item{background:#0d1726;border:1px solid var(--line);border-radius:15px;padding:13px}.item b{font-size:15px}.meta{color:var(--muted);font-size:12px;margin-top:5px}.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#20314b;color:#d8e6ff}.pill.red{background:#49202a;color:#ffb5bd}.pill.green{background:#123b30;color:#8ce0be}.pill.yellow{background:#443617;color:#f6cf7b}.empty{text-align:center;color:var(--muted);padding:24px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c1422f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav{border:0;background:none;color:#8192ab;font-size:10px;font-weight:700}.nav span{display:block;font-size:21px;line-height:22px;margin-bottom:2px}.nav.active{color:#fff}.search{width:100%;padding:12px;border:1px solid var(--line);background:#0d1726;color:#fff;border-radius:13px;margin:8px 0 12px}.form{display:grid;gap:7px}.form input,.form select,.form textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0c1523;color:#fff}.form textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.check input{width:auto}.notice{font-size:12px;color:#b9c6d8;background:#111e31;border:1px solid var(--line);padding:10px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">CS TAKİP</div><div class="sub">Cihan Sarper • Offline İş Takip Merkezi</div></header>
<main id="screen" class="content"></main>
<nav class="bottom">
<button class="nav active" data-p="home" onclick="show('home')"><span>⌂</span>Ana Panel</button>
<button class="nav" data-p="tasks" onclick="show('tasks')"><span>✓</span>İşler</button>
<button class="nav" data-p="sites" onclick="show('sites')"><span>🏢</span>Siteler</button>
<button class="nav" data-p="calendar" onclick="show('calendar')"><span>◷</span>Takvim</button>
<button class="nav" data-p="more" onclick="show('more')"><span>☷</span>Diğer</button>
</nav>
</div>
<script>
const K='CS_TAKIP_IPHONE11_V2';
let db=JSON.parse(localStorage.getItem(K)||'{"sites":[],"tasks":[],"events":[],"audits":[],"budgets":[],"docs":[]}');
function save(){localStorage.setItem(K,JSON.stringify(db))}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(p){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.p===p))}
function show(p){nav(p);({home,tasks,sites,calendar,more}[p])()}
function home(){
let today=new Date().toISOString().slice(0,10), open=db.tasks.filter(x=>x.status!=='Tamamlandı'), overdue=open.filter(x=>x.due&&x.due<today), done=db.tasks.filter(x=>x.status==='Tamamlandı');
screen.innerHTML=`<div class="hero"><h1>Hoş geldin 👋</h1><p>İnternet bağlantısı olmadan işlerini, sitelerini ve takvimini yönet.</p></div>
<div class="cards"><div class="card"><div class="label">Açık İş</div><div class="num">${open.length}</div></div><div class="card"><div class="label">Geciken</div><div class="num">${overdue.length}</div></div><div class="card"><div class="label">Siteler</div><div class="num">${db.sites.length}</div></div><div class="card"><div class="label">Tamamlanan</div><div class="num">${done.length}</div></div></div>
<div class="section"><h3>Hızlı İşlem</h3><div class="actions"><button class="btn" onclick="newTask()">＋ İş Ekle</button><button class="btn secondary" onclick="newSite()">＋ Site Ekle</button><button class="btn secondary" onclick="newEvent()">＋ Takvim</button><button class="btn secondary" onclick="show('more')">☷ Diğer</button></div></div>
<div class="section"><h3>Öncelikli İşler</h3><div class="list">${open.sort((a,b)=>((a.due||'9999')).localeCompare(b.due||'9999')).slice(0,5).map(taskCard).join('')||'<div class="empty">Açık iş bulunmuyor.</div>'}</div></div>`}
function taskCard(x){let c=x.priority==='Acil'?'red':x.priority==='Yüksek'?'yellow':'';return `<div class="item"><b>${e(x.title)}</b><div class="meta">${e(x.site||'Genel')} • ${e(x.due||'Tarih yok')}</div><div class="pills"><span class="pill ${c}">${e(x.priority)}</span><span class="pill">${e(x.status)}</span></div><button class="btn secondary" style="margin-top:9px" onclick="complete('${x.id}')">Tamamlandı</button></div>`}
function tasks(){
screen.innerHTML=`<h2>İş Takibi</h2><input class="search" placeholder="İşlerde ara..." oninput="filterTasks(this.value)"><button class="btn" onclick="newTask()">＋ Yeni İş</button><div id="tasklist" class="list" style="margin-top:10px">${db.tasks.map(taskCard).join('')||'<div class="empty">Henüz iş eklenmedi.</div>'}</div>`}
function filterTasks(q){q=q.toLowerCase();document.querySelectorAll('#tasklist .item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')}
function newTask(){
let title=prompt('İş başlığı:');if(!title)return;
let site=prompt('Site adı:')||'',due=prompt('Son tarih (YYYY-AA-GG):')||'',priority=prompt('Öncelik: Acil / Yüksek / Normal / Düşük','Normal')||'Normal',note=prompt('Not:')||'';
db.tasks.push({id:id(),title,site,due,priority,status:'Bekliyor',note});save();show('tasks')}
function complete(i){let x=db.tasks.find(a=>a.id===i);if(x)x.status='Tamamlandı';save();show('home')}
function sites(){
screen.innerHTML=`<h2>Site Yönetimi</h2><input class="search" placeholder="Site ara..." oninput="filterSites(this.value)"><button class="btn" onclick="newSite()">＋ Yeni Site</button><div id="sitelist" class="list" style="margin-top:10px">${db.sites.map(siteCard).join('')||'<div class="empty">Henüz site eklenmedi.</div>'}</div>`}
function siteCard(x){return `<div class="item"><b>${e(x.name)}</b><div class="meta">${e(x.blocks||'-')} blok • ${e(x.units||'-')} konut • ${e(x.manager||'Yönetici bilgisi yok')}</div><div class="pills"><span class="pill">${e(x.commercial||0)} ticari alan</span></div></div>`}
function filterSites(q){q=q.toLowerCase();document.querySelectorAll('#sitelist .item').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')}
function newSite(){
let name=prompt('Site adı:');if(!name)return;let blocks=prompt('Blok sayısı:')||'',units=prompt('Konut sayısı:')||'',commercial=prompt('Ticari alan sayısı:')||'',manager=prompt('Yönetici / iletişim:')||'';
db.sites.push({id:id(),name,blocks,units,commercial,manager});save();show('sites')}
function calendar(){
screen.innerHTML=`<h2>Takvim</h2><button class="btn" onclick="newEvent()">＋ Etkinlik Ekle</button><div class="list" style="margin-top:10px">${db.events.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="item"><b>${e(x.title)}</b><div class="meta">${e(x.date)} • ${e(x.type)}</div><div style="margin-top:6px">${e(x.note||'')}</div></div>`).join('')||'<div class="empty">Takvim boş.</div>'}</div>`}
function newEvent(){let title=prompt('Etkinlik:');if(!title)return;let date=prompt('Tarih (YYYY-AA-GG):')||'',type=prompt('Tür: Toplantı / Denetim / Genel Kurul / Ziyaret','Toplantı')||'',note=prompt('Not:')||'';db.events.push({id:id(),title,date,type,note});save();show('calendar')}
function more(){
screen.innerHTML=`<h2>Diğer Modüller</h2><div class="grid">
<div class="section"><h3>📋 Denetim</h3><button class="btn secondary" onclick="audits()">Denetim Takibi</button></div>
<div class="section"><h3>💰 Bütçe</h3><button class="btn secondary" onclick="budgets()">Bütçe Takibi</button></div>
<div class="section"><h3>💾 Veri Güvenliği</h3><div class="actions"><button class="btn secondary" onclick="backup()">Yedek Al</button><label class="btn secondary" style="text-align:center">Yedek Yükle<input type="file" accept=".json" onchange="restore(event)" style="display:none"></label></div><div class="notice">Kayıtlar bu iPhone'un tarayıcı depolamasında tutulur. Düzenli yedek al.</div></div>
<div class="section"><h3>⚠️ Sıfırlama</h3><button class="btn danger" onclick="wipe()">Tüm verileri sil</button></div></div>`}
function audits(){screen.innerHTML=`<h2>Denetim Takibi</h2><button class="btn" onclick="addAudit()">＋ Denetim Ekle</button><div class="list" style="margin-top:10px">${db.audits.map(x=>`<div class="item"><b>${e(x.site)}</b><div class="meta">${e(x.type)} • ${e(x.date)}</div><div class="pills"><span class="pill">${e(x.status)}</span></div></div>`).join('')||'<div class="empty">Kayıt yok.</div>'}</div>`}
function addAudit(){let site=prompt('Site:');if(!site)return;let type=prompt('Tür:','Mali Denetim')||'',date=prompt('Tarih:')||'';db.audits.push({id:id(),site,type,date,status:'Planlandı'});save();audits()}
function budgets(){screen.innerHTML=`<h2>Bütçe Takibi</h2><button class="btn" onclick="addBudget()">＋ Bütçe Ekle</button><div class="list" style="margin-top:10px">${db.budgets.map(x=>`<div class="item"><b>${e(x.site)}</b><div class="meta">${e(x.period)}</div><div class="pills"><span class="pill">${e(x.status)}</span></div></div>`).join('')||'<div class="empty">Kayıt yok.</div>'}</div>`}
function addBudget(){let site=prompt('Site:');if(!site)return;let period=prompt('Bütçe dönemi:','2026')||'';db.budgets.push({id:id(),site,period,status:'Hazırlanacak'});save();budgets()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CS_TAKIP_YEDEK_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.sites)throw 0;db=x;save();show('home')}catch{alert('Geçersiz CS TAKİP yedek dosyası.')}};r.readAsText(f)}
function wipe(){if(confirm('Tüm CS TAKİP kayıtları bu cihazdan silinecek. Emin misin?')){localStorage.removeItem(K);db={sites:[],tasks:[],events:[],audits:[],budgets:[],docs:[]};show('home')}}
show('home');
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body></html>
